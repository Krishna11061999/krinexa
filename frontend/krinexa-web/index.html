<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krinexa - Portfolio Site Test</title>
    <style>
        :root {
            --primary: #4F46E5;
            --background: #0f172a;
            --text: #f8fafc;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.25rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 2rem;
        }
        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            background: rgba(79, 70, 229, 0.2);
            color: #a5b4fc;
            border-radius: 9999px;
            font-weight: 500;
            border: 1px solid rgba(79, 70, 229, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="status">CI/CD Deployment Test</div>
        <h1>Welcome to Krinexa</h1>
        <p>This is a temporary test page to verify that the continuous integration and deployment pipeline is functioning correctly via GitHub Actions and Vercel.</p>
    </div>
</body>
</html>
